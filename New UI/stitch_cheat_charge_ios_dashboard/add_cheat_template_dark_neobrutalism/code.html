<!DOCTYPE html><html class="dark" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Add Cheat Template - Dark Neobrutalism</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Space Grotesk & Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@600;700;800&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['Space Grotesk', 'monospace'],
          },
          colors: {
            carbon: {
              950: '#09090b',
              900: '#0e0e12',
              800: '#16161b',
              700: '#22222a',
            },
            volt: '#ccff00',
            hotpink: '#ff2d55',
          },
          boxShadow: {
            'brutal': '4px 4px 0px 0px #000000',
            'brutal-sm': '2.5px 2.5px 0px 0px #000000',
            'brutal-white': '3px 3px 0px 0px #ffffff',
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Neobrutalism Styles -->
<style data-purpose="background-pattern">
    .dot-pattern {
      background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px);
      background-size: 16px 16px;
    }
  </style>
<style data-purpose="scrollbar-utilities">
    /* Hide scrollbar for neat mobile preview */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<!-- END: Custom Neobrutalism Styles -->
</head>
<body class="bg-black text-white antialiased min-h-screen flex items-center justify-center p-0 md:p-6 font-sans select-none">
<!-- BEGIN: Phone Mockup Wrapper (iPhone 15 format: 393px x 852px) -->
<main class="w-full max-w-[393px] h-[852px] bg-carbon-900 border-0 md:border-4 md:border-neutral-800 rounded-none md:rounded-[50px] shadow-2xl relative flex flex-col overflow-hidden dot-pattern" data-purpose="mobile-device-viewport">
<!-- BEGIN: iOS Status Bar & Dynamic Island -->
<header class="w-full pt-3 px-7 flex items-center justify-between z-30 shrink-0" data-purpose="ios-status-bar">
<!-- iOS Clock -->
<span class="text-sm font-semibold tracking-tight text-white font-mono">11:39</span>
<!-- Dynamic Island Pill -->
<div class="w-28 h-7 bg-black rounded-full border border-neutral-800/80 mx-auto flex items-center justify-between px-2.5">
<div class="w-2.5 h-2.5 rounded-full bg-neutral-900"></div>
<div class="w-2.5 h-2.5 rounded-full bg-blue-950/40 border border-blue-500/20"></div>
</div>
<!-- Status Bar Icons (Cellular, Wifi, Battery) -->
<div class="flex items-center space-x-1.5 text-xs text-white">
<!-- Cellular Icon -->
<svg class="w-4 h-3.5 fill-current" viewBox="0 0 17 12">
<rect height="4" rx="0.5" width="2.5" x="0" y="8"></rect>
<rect height="6.5" rx="0.5" width="2.5" x="4" y="5.5"></rect>
<rect height="9" rx="0.5" width="2.5" x="8" y="3"></rect>
<rect height="11.5" rx="0.5" width="2.5" x="12" y="0.5"></rect>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-3.5 fill-current" viewBox="0 0 16 12">
<path d="M8 2.5C10.7 2.5 13.1 3.6 14.8 5.4L16 4.1C13.9 2 11.1 0.8 8 0.8C4.9 0.8 2.1 2 0 4.1L1.2 5.4C2.9 3.6 5.3 2.5 8 2.5ZM8 6C9.7 6 11.2 6.7 12.3 7.8L13.5 6.6C12.1 5.2 10.1 4.3 8 4.3C5.9 4.3 3.9 5.2 2.5 6.6L3.7 7.8C4.8 6.7 6.3 6 8 6ZM8 9.5C8.8 9.5 9.5 9.8 10.1 10.4L8 12.5L5.9 10.4C6.5 9.8 7.2 9.5 8 9.5Z"></path>
</svg>
<!-- Battery Icon -->
<div class="flex items-center">
<div class="w-5 h-2.5 border border-white/80 rounded-[3px] p-0.5 flex items-center">
<div class="h-full w-3.5 bg-volt rounded-[1px]"></div>
</div>
<div class="w-0.5 h-1 bg-white/80 rounded-r-sm"></div>
</div>
</div>
</header>
<!-- END: iOS Status Bar & Dynamic Island -->
<!-- BEGIN: Top Modal Navigation Header -->
<nav class="px-5 pt-3 pb-2 flex items-center justify-between z-20" data-purpose="modal-header">
<!-- Cancel Button -->
<button class="px-3 py-1.5 bg-carbon-800 border-2 border-white/80 rounded-xl font-mono text-xs font-bold uppercase tracking-wider text-neutral-300 shadow-brutal-sm active:translate-x-0.5 active:translate-y-0.5 transition-all" type="button">
        Cancel
      </button>
<!-- Modal Title -->
<div class="flex items-center gap-1.5">
<span class="w-2 h-2 rounded-full bg-hotpink animate-pulse"></span>
<h1 class="text-sm font-mono font-extrabold uppercase tracking-widest text-white">
          New Template
        </h1>
</div>
<!-- Quick Save Action -->

</nav>
<!-- END: Top Modal Navigation Header -->
<!-- BEGIN: Main Scrollable Content Area -->
<div class="flex-1 overflow-y-auto px-5 py-3 space-y-4 no-scrollbar z-10" data-purpose="form-content">
<!-- SECTION 1: Category Picker -->
<section class="space-y-1.5" data-purpose="category-section">
<div class="flex items-center justify-between">
<label class="text-[11px] font-mono font-black uppercase tracking-widest text-neutral-400 flex items-center gap-1.5">

            Category
          </label>

</div>
<!-- Interactive Category Card Dropdown -->
<button class="w-full bg-carbon-800 border-2 border-white rounded-2xl p-3 shadow-brutal flex items-center justify-between group active:translate-x-0.5 active:translate-y-0.5 transition-all" type="button">
<span class="text-xs font-mono font-bold text-neutral-400 uppercase tracking-wide">Category</span>
<div class="flex items-center gap-2">
<div class="flex items-center gap-1.5 bg-carbon-700/80 px-2.5 py-1 rounded-lg border border-white/30">
<span class="text-base">🍽️</span>
<span class="font-mono text-xs font-bold text-white tracking-wide">Other</span>
</div>
<!-- Neobrutalist Dual Chevrons -->
<div class="w-7 h-7 rounded-lg bg-hotpink border-2 border-black flex items-center justify-center text-white text-xs font-black">
              ⇅
            </div>
</div>
</button>
</section>
<!-- SECTION 2: Icon Picker (6 cols x 3 rows mirroring reference) -->
<section class="space-y-1.5" data-purpose="icon-grid-selector">
<div class="flex items-center justify-between">
<label class="text-[11px] font-mono font-black uppercase tracking-widest text-neutral-400 flex items-center gap-1.5">

            Select Icon
          </label>

</div>
<!-- Grid Container with 2px white border and brutal drop shadow -->
<div class="bg-carbon-800 border-2 border-white rounded-2xl p-3 shadow-brutal">
<div class="grid grid-cols-6 gap-2">
<!-- Row 1 -->
<button class="h-10 rounded-xl bg-carbon-700/50 hover:bg-carbon-700 border border-white/10 flex items-center justify-center text-xl transition-all" type="button">🍔</button>
<button class="h-10 rounded-xl bg-carbon-700/50 hover:bg-carbon-700 border border-white/10 flex items-center justify-center text-xl transition-all" type="button">🍕</button>
<button class="h-10 rounded-xl bg-carbon-700/50 hover:bg-carbon-700 border border-white/10 flex items-center justify-center text-xl transition-all" type="button">🍗</button>
<button class="h-10 rounded-xl bg-carbon-700/50 hover:bg-carbon-700 border border-white/10 flex items-center justify-center text-xl transition-all" type="button">🍟</button>
<button class="h-10 rounded-xl bg-carbon-700/50 hover:bg-carbon-700 border border-white/10 flex items-center justify-center text-xl transition-all" type="button">🌯</button>
<button class="h-10 rounded-xl bg-carbon-700/50 hover:bg-carbon-700 border border-white/10 flex items-center justify-center text-xl transition-all" type="button">🍿</button>
<!-- Row 2 -->
<button class="h-10 rounded-xl bg-carbon-700/50 hover:bg-carbon-700 border border-white/10 flex items-center justify-center text-xl transition-all" type="button">🍺</button>
<button class="h-10 rounded-xl bg-carbon-700/50 hover:bg-carbon-700 border border-white/10 flex items-center justify-center text-xl transition-all" type="button">🍷</button>
<button class="h-10 rounded-xl bg-carbon-700/50 hover:bg-carbon-700 border border-white/10 flex items-center justify-center text-xl transition-all" type="button">🥃</button>
<button class="h-10 rounded-xl bg-carbon-700/50 hover:bg-carbon-700 border border-white/10 flex items-center justify-center text-xl transition-all" type="button">💧</button>
<button class="h-10 rounded-xl bg-carbon-700/50 hover:bg-carbon-700 border border-white/10 flex items-center justify-center text-xl transition-all" type="button">🍸</button>
<button class="h-10 rounded-xl bg-carbon-700/50 hover:bg-carbon-700 border border-white/10 flex items-center justify-center text-xl transition-all" type="button">🥤</button>
<!-- Row 3 -->
<button class="h-10 rounded-xl bg-carbon-700/50 hover:bg-carbon-700 border border-white/10 flex items-center justify-center text-xl transition-all" type="button">🍩</button>
<button class="h-10 rounded-xl bg-carbon-700/50 hover:bg-carbon-700 border border-white/10 flex items-center justify-center text-xl transition-all" type="button">🍰</button>
<button class="h-10 rounded-xl bg-carbon-700/50 hover:bg-carbon-700 border border-white/10 flex items-center justify-center text-xl transition-all" type="button">🍦</button>
<button class="h-10 rounded-xl bg-carbon-700/50 hover:bg-carbon-700 border border-white/10 flex items-center justify-center text-xl transition-all" type="button">🍫</button>
<button class="h-10 rounded-xl bg-carbon-700/50 hover:bg-carbon-700 border border-white/10 flex items-center justify-center text-xl transition-all" type="button">🤤</button>
<!-- Active Selected Icon (Plate & Cutlery matching reference position) -->
<button class="h-10 rounded-xl bg-hotpink/20 border-2 border-hotpink ring-2 ring-hotpink/30 flex items-center justify-center text-xl shadow-sm scale-105 transition-all relative" type="button">

              🍽️
            </button>
</div>
</div>
</section>
<!-- SECTION 3: Cheat Name Input -->
<section class="space-y-1.5" data-purpose="cheat-name-input">
<label class="text-[11px] font-mono font-black uppercase tracking-widest text-neutral-400 flex items-center gap-1.5" for="cheat-name">

          Cheat Name
        </label>
<div class="relative bg-carbon-800 border-2 border-white rounded-2xl p-1 shadow-brutal focus-within:border-volt transition-colors">
<input class="w-full bg-transparent border-0 text-white placeholder-neutral-500 font-medium text-sm px-3 py-2.5 focus:ring-0 focus:outline-none" id="cheat-name" placeholder="e.g. Homemade Smash Burger" type="text">
</div>
</section>
<!-- SECTION 4: Calorie Value Input with Presets -->
<section class="space-y-1.5" data-purpose="calorie-input-section">
<div class="flex items-center justify-between">
<label class="text-[11px] font-mono font-black uppercase tracking-widest text-neutral-400 flex items-center gap-1.5" for="calorie-value">

            Calorie Value
          </label>
<span class="text-[10px] font-mono text-neutral-400 font-bold uppercase">Estimated Energy</span>
</div>
<div class="relative bg-carbon-800 border-2 border-white rounded-2xl p-1.5 shadow-brutal flex items-center justify-between focus-within:border-volt transition-colors">
<input class="w-3/5 bg-transparent border-0 text-white font-mono font-bold text-xl px-3 py-1 focus:ring-0 focus:outline-none tracking-tight" id="calorie-value" placeholder="600" type="number" value="600">
<div class="bg-carbon-950 border-2 border-white/80 rounded-xl px-3 py-1 font-mono text-xs font-black uppercase text-volt shadow-brutal-sm">
            kcal
          </div>
</div>
<!-- Quick Calorie Stepper Pills -->
<!-- Quick increment buttons to speed up calorie input -->
<div class="grid grid-cols-4 gap-2 pt-1">




</div>
</section>
</div>
<!-- END: Main Scrollable Content Area -->
<!-- BEGIN: Bottom Primary Action & Home Bar -->
<footer class="p-5 pt-2 bg-gradient-to-t from-carbon-950 via-carbon-900 to-transparent shrink-0 z-20 space-y-3" data-purpose="bottom-action-container">
<!-- Full-Width High-Impact Neobrutalist Button -->
<button class="w-full py-3.5 hover:brightness-110 active:translate-x-1 active:translate-y-1 active:shadow-none border-2 border-white rounded-2xl font-mono text-sm font-black uppercase tracking-wider text-black shadow-brutal flex items-center justify-center gap-2 transition-all" type="button" style="background-color: #FF4D6D;">
<span class="">Save Cheat Template</span>
<span class="text-base">→</span>
</button>
<!-- iOS Home Indicator Pill -->
<div class="w-32 h-1 bg-white/40 rounded-full mx-auto mt-1" data-purpose="ios-home-bar"></div>
</footer>
<!-- END: Bottom Primary Action & Home Bar -->
</main>
<!-- END: Phone Mockup Wrapper -->






</body></html>
