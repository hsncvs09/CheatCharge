<!DOCTYPE html><html class="dark" lang="tr" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Antrenmanlar - Dark Neobrutalism</title>
<!-- Tailwind CSS CDN with Forms & Container Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Space Grotesk -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<!-- Tailwind Configuration for Kinetic Volt Theme -->
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            volt: '#ccff00',
            surface: {
              DEFAULT: '#131313',
              card: '#1c1c20',
              container: '#18181b',
              border: '#2a2a30',
            },
            energy: {
              orange: '#ff7a00',
              amber: '#ff9f0a',
              fire: '#ff4d00'
            }
          },
          fontFamily: {
            sans: ['"Space Grotesk"', 'sans-serif'],
          },
          boxShadow: {
            'brutal-volt': '3px 3px 0px #ccff00',
            'brutal-orange': '3px 3px 0px #ff7a00',
            'brutal-dark': '3px 3px 0px #000000',
            'brutal-card': '4px 4px 0px #0a0a0c',
            'brutal-btn': '2.5px 2.5px 0px #000000',
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Neobrutalist Styles -->
<style data-purpose="neobrutalist-patterns">
    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #080809;
    }
    
    /* Neobrutalist Dot Grid Canvas Background */
    .dot-grid-bg {
      background-color: #0d0d10;
      background-image: radial-gradient(rgba(204, 255, 0, 0.12) 1px, transparent 1px),
                        radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
    }

    /* Subtle active press feedback for neobrutalist elements */
    .brutal-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px transparent !important;
    }
  </style>
<!-- END: Custom Neobrutalist Styles -->
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4 text-white antialiased selection:bg-volt selection:text-black">
<!-- BEGIN: Mobile Container (iPhone 15 frame) -->
<main class="w-full max-w-[393px] h-[852px] max-h-screen bg-[#0d0d10] dot-grid-bg flex flex-col justify-between border-0 sm:border-[3px] border-[#222227] sm:rounded-[50px] overflow-hidden relative shadow-2xl">
<!-- BEGIN: iOS Status Bar & Dynamic Island -->
<header class="w-full pt-3 px-7 flex items-center justify-between text-xs font-semibold tracking-wider z-30 select-none">
<!-- Time -->
<span class="text-white text-[15px] font-bold tracking-tight">9:41</span>
<!-- Dynamic Island cutout placeholder -->
<div class="w-28 h-6 bg-black rounded-full flex items-center justify-end pr-2.5 space-x-1.5 border border-[#1f1f23] shadow-inner">
<span class="w-2.5 h-2.5 rounded-full bg-[#111] border border-[#2b2b30]"></span>
<span class="w-2.5 h-2.5 rounded-full bg-volt/30 flex items-center justify-center">
<span class="w-1.5 h-1.5 rounded-full bg-volt animate-ping"></span>
</span>
</div>
<!-- System Icons -->
<div class="flex items-center space-x-1.5 text-white text-[13px]">
<!-- Cellular Signal -->
<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.25C2.89 16.48 2 14.34 2 12c0-5.52 4.48-10 10-10s10 4.48 10 10c0 2.34-.89 4.48-2.35 6.25l-.62-.64C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"></path>
<path d="M12 7a5 5 0 0 0-5 5c0 1.28.48 2.45 1.28 3.34l.71-.71A3.98 3.98 0 0 1 8 12a4 4 0 1 1 8 0c0 .98-.36 1.88-.99 2.63l.71.71A4.98 4.98 0 0 0 17 12a5 5 0 0 0-5-5z"></path>
<circle cx="12" cy="12" r="2"></circle>
</svg>
<!-- WiFi -->
<svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A17.88 17.88 0 0 0 12 4zm0 3.25c3.67 0 7.02 1.34 9.61 3.56L12 19.33 2.39 10.81A14.62 14.62 0 0 1 12 7.25z"></path>
</svg>
<!-- Battery with Percentage Capsule -->
<div class="flex items-center space-x-1 pl-0.5">
<span class="text-[11px] font-bold">100%</span>
<div class="w-5 h-2.5 border border-white rounded-[4px] p-[1px] flex items-center">
<div class="w-full h-full bg-volt rounded-[2px]"></div>
</div>
</div>
</div>
</header>
<!-- END: iOS Status Bar & Dynamic Island -->
<!-- BEGIN: Scrollable Content Container -->
<div class="flex-1 overflow-y-auto px-5 pt-3 pb-24 scrollbar-none" data-purpose="workouts-content-area">
<!-- BEGIN: Top Bar Navigation -->
<div class="flex items-center justify-between mt-2 mb-6" data-purpose="navigation-header">
<div>
<span class="text-[11px] font-extrabold tracking-widest text-[#888] uppercase block mb-0.5"><br></span>
<h1 class="text-3xl font-extrabold tracking-tight text-white uppercase">Charges</h1>
</div>
<!-- Action Buttons (Health Heart & Add Workout) -->
<div class="flex items-center space-x-2.5">
<!-- Heart Button -->
<button aria-label="Apple Health Sync" class="brutal-btn w-10 h-10 bg-[#1c1c20] hover:bg-[#25252b] border-2 border-white/80 rounded-xl flex items-center justify-center text-red-500 shadow-brutal-dark transition-all" type="button">
<svg class="w-5 h-5 fill-red-500 stroke-red-500" viewBox="0 0 24 24">
<path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<!-- Add Button (Volt Green Neobrutal Pill) -->
<button aria-label="Yeni Antrenman Ekle" class="brutal-btn w-10 h-10 bg-volt hover:bg-[#b8e600] border-2 border-black rounded-xl flex items-center justify-center text-black font-black text-2xl shadow-brutal-dark transition-all" type="button">
            +
          </button>
</div>
</div>
<!-- END: Top Bar Navigation -->
<!-- BEGIN: Weekly Summary Banner -->
<section class="mb-5 bg-[#17171b] border-2 rounded-2xl p-4 shadow-brutal-dark border-white" data-purpose="weekly-summary-section">
<div class="flex items-end justify-between">
<!-- Left: Subtitle & Mode Badge -->
<div>
<div class="text-[12px] font-black uppercase tracking-wider text-[#a1a1aa] mb-1.5 flex items-center gap-1.5">
<span class="">Thıs week</span>
<span class="w-1.5 h-1.5 rounded-full bg-volt"></span>
</div>
<!-- Clickable Interactive Manual Filter Badge -->
<button class="brutal-btn inline-flex items-center space-x-1.5 bg-[#24242b] hover:bg-[#2e2e38] text-volt border-[1.5px] border-volt/60 text-xs font-bold px-2.5 py-1 rounded-lg uppercase tracking-wider transition-all" type="button">
<span class="text-xs">👆</span>
<span class="">3 MANUEL</span>
</button>
</div>
<!-- Right: Total Burned Energy Value -->
<div class="text-right">
<span class="block text-[10px] font-extrabold uppercase tracking-widest text-[#888] mb-0.5">Total burned</span>
<div class="inline-flex items-baseline gap-1 text-energy-amber font-extrabold text-2xl tracking-tight bg-black/40 px-2.5 py-0.5 rounded-lg border border-energy-amber/40">
<span class="">1.690</span>
<span class="text-xs font-black text-energy-amber/80 uppercase">KCAL</span>
</div>
</div>
</div>
</section>
<!-- END: Weekly Summary Banner -->
<!-- BEGIN: Workout Cards Section -->
<section class="space-y-3.5" data-purpose="workout-items-list">
<!-- ITEM 1: AĞIRLIK (Weightlifting) -->
<article class="brutal-btn group bg-[#18181c] border-2 rounded-2xl p-3.5 shadow-brutal-dark hover:border-volt transition-all border-white">
<div class="flex items-center justify-between">
<!-- Icon + Title + Afterburn Tag -->
<div class="flex items-center space-x-3">
<!-- Custom Brutalist Icon Frame -->
<div class="w-12 h-12 rounded-xl bg-[#23232a] border-2 border-black flex items-center justify-center text-2xl shadow-[2px_2px_0px_#000]">
                🏋️
              </div>
<div>
<div class="flex items-center flex-wrap gap-1.5 mb-1">
<h2 class="text-base font-extrabold text-white tracking-wide">Weight</h2>
<!-- Dynamic Afterburn Badge -->
<span class="inline-flex items-center text-[10px] font-black uppercase tracking-tight text-white bg-energy-fire/90 border border-orange-400 px-1.5 py-0.5 rounded-md shadow-[1px_1px_0px_#000]">
                    +90 kcal Afterburn 🔥
                  </span>
</div>
<p class="text-xs font-semibold text-[#8e8e93]">Oct 15, 2026</p>
</div>
</div>
<!-- Calorie Value -->
<div class="text-right">
<span class="text-lg font-black text-energy-amber tracking-tight block">
                540 <span class="text-xs font-bold text-energy-amber/80">kcal</span>
</span>
<span class="text-[10px] font-bold text-[#666] uppercase">strength</span>
</div>
</div>
</article>
<!-- ITEM 2: KOŞU (Running) -->
<article class="brutal-btn group bg-[#18181c] border-2 rounded-2xl p-3.5 shadow-brutal-dark hover:border-volt transition-all border-white">
<div class="flex items-center justify-between">
<!-- Icon + Title -->
<div class="flex items-center space-x-3">
<div class="w-12 h-12 rounded-xl bg-[#23232a] border-2 border-black flex items-center justify-center text-2xl shadow-[2px_2px_0px_#000]">
                🏃
              </div>
<div>
<h2 class="text-base font-extrabold text-white tracking-wide mb-1">Run</h2>
<p class="text-xs font-semibold text-[#8e8e93]">Oct 13, 2026</p>
</div>
</div>
<!-- Calorie Value -->
<div class="text-right">
<span class="text-lg font-black text-energy-amber tracking-tight block">
                500 <span class="text-xs font-bold text-energy-amber/80">kcal</span>
</span>
<span class="text-[10px] font-bold text-[#666] uppercase">CArdıo</span>
</div>
</div>
</article>
<!-- ITEM 3: BİSİKLET (Cycling) -->
<article class="brutal-btn group bg-[#18181c] border-2 rounded-2xl p-3.5 shadow-brutal-dark hover:border-volt transition-all border-white">
<div class="flex items-center justify-between">
<!-- Icon + Title -->
<div class="flex items-center space-x-3">
<div class="w-12 h-12 rounded-xl bg-[#23232a] border-2 border-black flex items-center justify-center text-2xl shadow-[2px_2px_0px_#000]">
                🚴
              </div>
<div>
<h2 class="text-base font-extrabold text-white tracking-wide mb-1">Bicycle</h2>
<p class="text-xs font-semibold text-[#8e8e93]">Oct 13, 2026</p>
</div>
</div>
<!-- Calorie Value -->
<div class="text-right">
<span class="text-lg font-black text-energy-amber tracking-tight block">
                650 <span class="text-xs font-bold text-energy-amber/80">kcal</span>
</span>
<span class="text-[10px] font-bold text-[#666] uppercase">endurance</span>
</div>
</div>
</article>
</section>
<!-- END: Workout Cards Section -->
<!-- BEGIN: Sync Notice Footer Item -->
<footer class="mt-6 flex items-center justify-center space-x-2 text-[#71717a] text-xs font-semibold" data-purpose="sync-timestamp">
<svg class="w-3.5 h-3.5 animate-spin-slow stroke-current" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
<span class="">Last Synced: Oct 14, 2026 at 19:40</span>
</footer>
<!-- END: Sync Notice Footer Item -->
</div>
<!-- END: Scrollable Content Container -->
<!-- BEGIN: Neobrutalist Floating Navigation Dock -->

<!-- END: Neobrutalist Floating Navigation Dock -->
</main>
<!-- END: Mobile Container -->




</body></html>
