<!DOCTYPE html><html lang="tr" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Kaçamak Ekle - Dark Neobrutalism</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Space Grotesk & Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@600;700;800&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"Space Grotesk"', 'sans-serif'],
          },
          colors: {
            darkBg: '#0e1015',
            cardBg: '#171922',
            coralPink: '#ff4d79',
            voltGreen: '#d4ff00',
            brutalBorder: '#ffffff',
          },
          boxShadow: {
            'brutal-sm': '2px 2px 0px #000000',
            'brutal': '3px 3px 0px #000000',
            'brutal-lg': '4px 4px 0px #000000',
            'brutal-coral': '3px 3px 0px #ff4d79',
          }
        }
      }
    }
  </script>
<style data-purpose="background-patterns">
    /* Subtle dot grid pattern matching dark neobrutalist style */
    .bg-grid-dots {
      background-color: #0d0f14;
      background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px);
      background-size: 16px 16px;
    }
  </style>
<style data-purpose="typography">
    .font-heavy {
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: -0.02em;
    }
    .badge-label {
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen p-0 sm:p-4 text-white select-none antialiased">
<!-- BEGIN: PhoneFrame -->
<!-- iPhone 15 frame (393px width, 852px height) -->
<div class="relative w-[393px] h-[852px] bg-darkBg bg-grid-dots rounded-[50px] border-[5px] border-[#252833] overflow-hidden shadow-2xl flex flex-col justify-between" data-purpose="iphone-container">
<!-- BEGIN: iOSStatusBar -->
<header class="w-full pt-3 px-7 flex justify-between items-center z-30" data-purpose="ios-status-bar">
<!-- Time -->
<span class="text-sm font-semibold tracking-tight text-white font-heavy">11:39</span>
<!-- Dynamic Island Cutout Pill -->
<div class="h-6 w-28 bg-black rounded-full flex items-center justify-end px-2 border border-white/10">
<div class="w-2.5 h-2.5 rounded-full bg-[#1c2230] border border-white/10 mr-1.5"></div>
</div>
<!-- Battery & Signal Icons -->
<div class="flex items-center space-x-1.5 text-xs text-white">
<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.25A9.97 9.97 0 012 12C2 6.48 6.48 2 12 2s10 4.48 10 10c0 2.3-.78 4.43-2.1 6.13l-.62-.62C20.35 16.03 21 14.1 21 12c0-4.97-4.03-9-9-9zm0 4a5 5 0 00-5 5c0 1.25.46 2.39 1.22 3.28l.71-.71A3.978 3.978 0 018 12c0-2.21 1.79-4 4-4s4 1.79 4 4c0 1.05-.41 2.01-1.07 2.72l.71.71C16.49 14.48 17 13.3 17 12a5 5 0 00-5-5z"></path>
</svg>
<div class="flex items-center border border-white/80 rounded-[4px] px-[2px] py-[1px] h-3.5 w-6">
<div class="bg-[#d4ff00] h-full w-[85%] rounded-[1px]"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: ModalHeader -->
<nav class="px-5 pt-3 pb-2 flex items-center justify-between z-20" data-purpose="modal-header">
<!-- Cancel action -->
<button class="text-sm font-semibold text-gray-400 hover:text-white transition-colors" data-purpose="cancel-button" type="button">
        Cancel</button>
<!-- Center Title with Accent Dot -->
<div class="flex items-center space-x-2">
<span class="inline-block w-2 h-2 rounded-full bg-coralPink animate-pulse"></span>
<h1 class="text-base font-extrabold font-heavy tracking-wide text-white uppercase">
          add cheat</h1>
</div>
<!-- Quick Save Action -->

</nav>
<!-- END: ModalHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 px-4 overflow-y-auto pb-2 pt-2 mt-1" data-purpose="form-scrollable-area">
<!-- BEGIN: CheatCategoryCard -->
<div class="flex justify-between items-center mb-1.5 px-1"><span class="text-[11px] font-extrabold uppercase font-heavy tracking-wider text-gray-400">CHEAT TYPE</span></div><section class="bg-cardBg rounded-2xl border-2 border-white p-3.5 shadow-brutal" data-purpose="cheat-selector-card">
<!-- Selected Preview Info -->
<div class="flex items-center justify-between pb-3 border-b border-white/10">
<div class="flex items-center space-x-3">
<div class="w-10 h-10 rounded-xl bg-coralPink/15 border-2 border-coralPink flex items-center justify-center text-xl">
              🍸
            </div>
<div>

<h2 class="text-base font-bold text-white font-heavy">Kokteyl</h2>
</div>
</div>
<!-- Category dropdown trigger -->
<button class="flex items-center space-x-1.5 px-2.5 py-1.5 rounded-lg bg-[#222634] border border-white/30 text-xs font-semibold font-heavy text-white hover:border-white" type="button">
<span class="">Alcohol</span>
<svg class="w-3.5 h-3.5 text-gray-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M8 9l4-4 4 4m0 6l-4 4-4-4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Cheat Type Quick Pills -->
<div class="grid grid-cols-4 gap-2 pt-3" data-purpose="cheat-item-pills">
<!-- Active Pill (Alkol/Kokteyl) -->
<button class="flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-coralPink text-black border-2 border-white shadow-brutal-sm transition-transform active:scale-95" type="button">
<span class="text-xl leading-none">🍸</span>
<span class="text-[11px] font-heavy font-bold mt-1.5 leading-tight">Kokteyl</span>
</button>
<!-- Burger Pill -->
<button class="flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-[#202430] hover:bg-[#282d3d] text-white border border-white/20 transition-transform active:scale-95" type="button">
<span class="text-xl leading-none">🍔</span>
<span class="text-[11px] font-heavy text-gray-300 mt-1.5 leading-tight">Burger</span>
</button>
<!-- Pizza Pill -->
<button class="flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-[#202430] hover:bg-[#282d3d] text-white border border-white/20 transition-transform active:scale-95" type="button">
<span class="text-xl leading-none">🍕</span>
<span class="text-[11px] font-heavy text-gray-300 mt-1.5 leading-tight">Pizza</span>
</button>
<!-- Tatlı Pill -->
<button class="flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-[#202430] hover:bg-[#282d3d] text-white border border-white/20 transition-transform active:scale-95" type="button">
<span class="text-xl leading-none">🍰</span>
<span class="text-[11px] font-heavy text-gray-300 mt-1.5 leading-tight">Cake</span>
</button>
</div>
</section>
<!-- END: CheatCategoryCard -->
<!-- BEGIN: CalorieIntakeCard -->
<section data-purpose="calorie-input-section" class="mt-5">
<!-- Section Header Label -->
<div class="flex justify-between items-center mb-1.5 px-1">
<span class="text-[11px] font-extrabold uppercase font-heavy tracking-wider text-gray-400">spent calorıe</span>
<span class="text-[10px] font-bold uppercase tracking-wider text-coralPink flex items-center gap-1">
<svg class="w-3 h-3 fill-current" viewBox="0 0 20 20">
<path clip-rule="evenodd" d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.527.82-1.144 2.152-1.144 3.952 0 .584-.077 1.02-.236 1.344-.15.308-.372.508-.667.63a3.57 3.57 0 01-1.28.24c-.958 0-1.785-.45-2.285-1.146a1 1 0 00-1.614.992c.382 1.378 1.488 2.87 3.037 3.766A7.002 7.002 0 0010 17a7 7 0 006.84-5.503c.09-.548.16-1.13.16-1.747 0-2.457-1.143-4.636-2.585-5.942a7.35 7.35 0 00-2.02-1.255z" fill-rule="evenodd"></path>
</svg>
            Cheat Expense
          </span>
</div>
<!-- Main Display Box -->
<div class="bg-cardBg rounded-2xl border-2 border-white p-3.5 shadow-brutal flex items-center justify-between">
<!-- Large Calorie Number -->
<div class="flex items-baseline space-x-1">
<span class="text-4xl font-black font-heavy text-white tracking-tight">350</span>
<span class="text-coralPink font-heavy text-lg font-bold">kcal</span>
</div>
<!-- Unit Pill Badge with Neobrutalism Border -->
<div class="flex items-center space-x-1.5 bg-[#251720] border-2 border-coralPink text-coralPink px-3.5 py-1.5 rounded-xl shadow-brutal-sm">
<span class="text-xs font-black font-heavy uppercase tracking-wide">− KCAL</span>
</div>
</div>
<!-- Quick Addition Increments -->
<div class="grid grid-cols-4 gap-2 mt-2" data-purpose="quick-add-increments">




</div>
</section>
<!-- END: CalorieIntakeCard -->
<!-- BEGIN: BalanceImpactCard -->
<!-- Cheat & Charge Core Mechanic: Deduction from earned workout calories -->
<div class="flex justify-between items-center mb-1.5 px-1 mt-4"><span class="text-[11px] font-extrabold uppercase font-heavy tracking-wider text-gray-400">ESTIMATION</span></div><section class="bg-cardBg rounded-2xl border-2 border-white p-3.5 shadow-brutal relative overflow-hidden" data-purpose="balance-impact-card">
<div class="flex justify-between items-start">
<div>
<p class="text-[10px] font-extrabold uppercase font-heavy tracking-wider text-gray-400">fuel balance effect</p>
<div class="flex items-center space-x-2 mt-1">
<span class="text-sm font-bold text-gray-400 line-through">520 kcal</span>
<span class="text-white text-xs font-black">➔</span>
<span class="text-lg font-black font-heavy text-voltGreen">170 kcal</span>
<span class="text-[10px] font-bold text-gray-400">left</span>
</div>
</div>
<!-- Safe Limit Badge -->
<span class="px-2.5 py-1 rounded-full bg-voltGreen/20 border border-voltGreen text-voltGreen text-[10px] font-heavy font-extrabold uppercase tracking-wide">
            ✓ suffıcıent balance</span>
</div>
<!-- Progress Indicator Bar -->
<div class="mt-3">
<div class="w-full bg-[#101218] rounded-full h-2.5 p-0.5 border border-white/20">
<!-- 520 total, 350 spent, 170 remaining (~32% green remain, 68% coral spent) -->
<div class="flex h-full rounded-full overflow-hidden">
<div class="bg-coralPink h-full w-[68%]" title="Bu kaçamak"></div>
<div class="bg-voltGreen h-full w-[32%]" title="Kalan bakiye"></div>
</div>
</div>
<div class="flex justify-between items-center text-[10px] font-semibold text-gray-400 mt-1.5 font-heavy">
<span class="text-coralPink flex items-center gap-1">● Spent: 350 kcal</span>
<span class="text-voltGreen flex items-center gap-1">● Net Letf: 170 kcal</span>
</div>
</div>
</section>
<!-- END: BalanceImpactCard -->
<!-- BEGIN: DateTimeCard -->
<div class="flex justify-between items-center mb-1.5 px-1 mt-4"><span class="text-[11px] font-extrabold uppercase font-heavy tracking-wider text-gray-400">DATE &amp; TIME</span></div><section class="bg-cardBg rounded-2xl border-2 border-white p-3.5 shadow-brutal space-y-2.5" data-purpose="date-time-card">
<div class="flex items-center justify-between">
<div class="flex items-center space-x-2">
<!-- Diamond icon consistent with SCREEN_8 -->
<span class="text-white text-xs">◆</span>
<span class="text-xs font-bold font-heavy uppercase tracking-wide text-white">date &amp; Tıme</span>
</div>
<div class="flex items-center space-x-2">
<!-- Date Pill -->
<button class="flex items-center space-x-1.5 px-2.5 py-1 rounded-lg bg-[#222634] border border-white/30 text-xs font-bold font-heavy text-white" type="button">
<span class="">📅</span>
<span class="">15 Oct 2026</span>
</button>
<!-- Time Pill -->
<button class="px-2.5 py-1 rounded-lg bg-[#222634] border border-white/30 text-xs font-bold font-heavy text-voltGreen" type="button">
              11:39
            </button>
</div>
</div>
<!-- Notice helper message consistent with original app tone -->
<div class="flex items-start space-x-1.5 pt-1 text-[11px] text-gray-400 leading-tight">
<svg class="w-3.5 h-3.5 text-gray-400 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="10"></circle>
<path d="M12 16v-4M12 8h.01"></path>
</svg>
<span class="">Only cheats from the current week can be added retroactively.</span>
</div>
</section>
<!-- END: DateTimeCard -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: BottomActionSection -->
<footer class="p-4 pt-2 pb-5 z-20 flex flex-col items-center" data-purpose="bottom-action-container">
<!-- Primary Save Cheat Meal CTA Button in Bold Coral / Neobrutalist -->
<button class="w-full bg-coralPink hover:bg-[#ff3366] text-black font-heavy font-black text-sm tracking-wider uppercase py-3.5 rounded-2xl border-2 border-white shadow-brutal flex items-center justify-center space-x-2 active:translate-x-0.5 active:translate-y-0.5 transition-all" data-purpose="primary-save-button" type="button">
<span class="">save the cheat</span>
<svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- iOS Home Indicator Bar -->
<div class="w-32 h-1 bg-white/70 rounded-full mt-4" data-purpose="home-indicator"></div>
</footer>
<!-- END: BottomActionSection -->
</div>
<!-- END: PhoneFrame -->






</body></html>
